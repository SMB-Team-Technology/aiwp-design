name: Desktop builds

# Rolling desktop builds for internal distribution.
#
# Every push to main produces macOS / Windows / Linux bundles and republishes
# them to a single prerelease at the `main-build` tag, so the download URLs stay
# stable and the Releases page does not accumulate one entry per commit.
#
# This is NOT the upstream release pipeline. `release-*.yml` publish exact
# versions to R2 with signing, notarization, and updater feeds, and need
# secrets this fork does not hold. These builds are unsigned — see the release
# notes generated below.

on:
  push:
    branches: ['main']
  workflow_dispatch:

# A newer commit makes an in-flight build obsolete: only the newest main build
# can win the `main-build` tag anyway, and desktop bundles are slow enough that
# overlapping runs would queue for a long time.
concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One platform failing should not withhold the bundles that did build.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            platform: mac
            format: dmg
            # Matched by name under the platform's output root rather than by
            # a fixed path: the namespace segment is derived from the app
            # version and moves the moment a channel suffix reaches
            # package.json.
            artifact: '*.dmg'
            asset: AIWP-Design-macos-arm64.dmg
          - label: Windows (x64)
            runner: windows-latest
            platform: win
            format: nsis
            artifact: '*-setup.exe'
            asset: AIWP-Design-windows-x64.exe
          - label: Linux (x86_64)
            runner: ubuntu-latest
            platform: linux
            format: appimage
            artifact: '*.AppImage'
            asset: AIWP-Design-linux-x86_64.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installed before setup-node so its pnpm cache resolution finds a store.
      # Corepack is deliberately not used: it is absent from some Node
      # distributions and fails with EPERM on Windows runners.
      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm@10.33.2

      # tools-pack builds the Windows installer with its own NSIS script and
      # shells out to makensis directly, so it needs a real NSIS install — it
      # never triggers the electron-builder download that would otherwise
      # populate the cache it also looks in. Chocolatey installs to
      # "C:\\Program Files (x86)\\NSIS", one of the paths resolveMakensisCommand
      # probes.
      - name: Install NSIS
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall compiles tools-pack and the packages it depends on, which
      # is what puts the `tools-pack` binary on the path.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --portable is mandatory for anything that leaves this runner. Without
      # it tools-pack bakes the build machine's own runtime root (an absolute
      # path under .tmp/tools-pack/runtime/...) into the packaged config, and
      # the app then looks for its data directory at a path that exists only
      # here. Portable builds fall back to Electron's per-machine userData.
      - name: Build ${{ matrix.platform }} bundle
        run: pnpm tools-pack ${{ matrix.platform }} build --to ${{ matrix.format }} --portable

      # Bundle filenames carry the namespace token, so normalize to a stable
      # asset name before upload — the release URLs must not move between runs.
      # find(1), not a shell glob: macOS runners are still bash 3.2, which has
      # no `globstar`, and `shopt -s globstar` is a hard error there.
      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          root=".tmp/tools-pack/out/${{ matrix.platform }}"
          match="$(find "$root" -type f -name '${{ matrix.artifact }}' -print 2>/dev/null | head -n 1 || true)"
          if [ -z "$match" ]; then
            echo "No bundle matching '${{ matrix.artifact }}' under $root" >&2
            echo "Files present:" >&2
            find "$root" -maxdepth 6 -type f >&2 || true
            exit 1
          fi
          mkdir -p dist
          cp "$match" "dist/${{ matrix.asset }}"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    # Publish whatever built, even if one platform failed, so a broken Windows
    # build does not also withhold a working macOS one.
    if: ${{ always() && needs.build.result != 'cancelled' }}
    permissions:
      contents: write
    steps:
      # Only the notes file is needed here; the bundles arrive as artifacts.
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
          sparse-checkout-cone-mode: false

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Republish main-build release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-build
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "No bundles were produced; nothing to publish." >&2
            exit 1
          fi
          ls -lh dist

          # Delete and recreate rather than edit: the tag has to move to the
          # commit being built, and replacing the release is the only way to
          # guarantee a bundle from an earlier commit is not left attached.
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Development build (main)" \
            --prerelease \
            --notes-file .github/release-notes/main-build.md

          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
